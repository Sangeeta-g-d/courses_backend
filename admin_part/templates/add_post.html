{% extends 'admin_base.html' %}
{% block content %}

<div class="page-heading">
    <h3>Add Post</h3>
</div>

<div class="page-content mt-4">
    <div class="card">
        <div class="card-body">

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Title -->
    <div class="mb-3">
        <label class="form-label">
            Title <small class="text-muted">(optional)</small>
        </label>
        <input type="text" class="form-control" name="title">
    </div>

    <!-- Image 1 -->
    <div class="mb-3">
        <label class="form-label">Image 1</label>
        <input type="file" class="form-control" name="image1" accept="image/*">
    </div>

    <!-- Image 2 -->
    <div class="mb-3">
        <label class="form-label">Image 2</label>
        <input type="file" class="form-control" name="image2" accept="image/*">
    </div>

    <!-- Image 3 -->
    <div class="mb-3">
        <label class="form-label">Image 3</label>
        <input type="file" class="form-control" name="image3" accept="image/*">
    </div>

    <!-- Caption -->
    <div class="mb-3">
        <label class="form-label">Caption</label>
        <textarea class="form-control" name="caption" rows="4"></textarea>
    </div>

    <!-- Active -->
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="is_active" checked>
        <label class="form-check-label">Active</label>
    </div>

    <button class="btn btn-primary">Add Post</button>
</form>

        </div>
    </div>
</div>

{% include 'notify.html' %}
{% endblock %}
