{% extends 'admin_base.html' %}
{% block content %}

<div class="page-heading d-flex justify-content-between align-items-center">
    <h3>Banner Images</h3>
    <a href="{% url 'add_banner' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Add Banner
    </a>
</div>

<div class="page-content mt-4">
    {% if banners %}
        <div class="row g-3">
            {% for banner in banners %}
            <div class="col-md-3 col-sm-4 col-6">
                <div class="card h-100 shadow-sm">
                    <img src="{{ banner.image.url }}" class="card-img-top" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <small class="text-muted">
                            {{ banner.created_at|date:"d M Y, h:i A" }}
                        </small>
                        <div>
                            <form action="{% url 'delete_banner' banner.id %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Delete this banner?');">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="text-center py-5">
            <i class="bi bi-image fs-1 text-muted"></i>
            <h4>No Banners Found</h4>
        </div>
    {% endif %}
</div>

{% include 'notify.html' %}
{% endblock %}
