<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ session.title }} | Live Session</title>

  <link rel="icon" href="/static/images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  :root {
    --header-height: 70px;
    --info-height: 40px;
    --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --success-color: #28a745;
    --dark-bg: #111;
    --darker-bg: #0a0a0a;
    --card-bg: #1a1a1a;
    --text-light: #fff;
    --text-muted: #ccc;
    --border-color: #333;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--primary-gradient);
    color: var(--text-light);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    background-attachment: fixed;
  }

  /* HEADER */
  .meeting-header {
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    text-align: center;
    padding: 15px 20px;
    border-bottom: 1px solid var(--border-color);
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  .meeting-header h3 {
    font-size: clamp(18px, 4vw, 24px);
    margin: 0;
    line-height: 1.3;
    word-break: break-word;
    font-weight: 600;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  /* MEETING INFO */
  .meeting-info {
    text-align: center;
    padding: 10px 20px;
    color: var(--text-muted);
    font-size: clamp(13px, 2.8vw, 15px);
    line-height: 1.5;
    word-wrap: break-word;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    border-bottom: 1px solid var(--border-color);
  }

  .meeting-info strong {
    color: var(--text-light);
  }

  /* STATUS TEXT */
  #status {
    text-align: center;
    color: var(--text-muted);
    font-size: clamp(14px, 2.8vw, 16px);
    padding: 10px 20px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(5px);
    border-bottom: 1px solid var(--border-color);
  }

  /* ZOOM SDK CONTAINER */
  #meetingSDKElement {
    width: 100%;
    height: calc(100vh - 140px);
    background: var(--darker-bg);
  }

  /* DISPLAY NAME MODAL */
  #nameModal {
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    z-index: 9999;
    padding: 20px;
    animation: fadeIn 0.3s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #nameModal > div {
    width: 100%;
    max-width: 450px;
    background: var(--card-bg);
    padding: 40px 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid var(--border-color);
  }

  #nameModal h3 {
    color: var(--text-light);
    margin-bottom: 25px;
    font-size: 24px;
    font-weight: 600;
  }

  #nameModal p {
    color: var(--text-muted);
    margin-bottom: 25px;
    font-size: 16px;
  }

  #displayNameInput {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    border: 2px solid var(--border-color);
    border-radius: 10px;
    background: var(--dark-bg);
    color: var(--text-light);
    box-sizing: border-box;
    margin-bottom: 25px;
    transition: border-color 0.3s ease;
  }

  #displayNameInput:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  #joinBtn {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    background: var(--primary-gradient);
    color: var(--text-light);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
  }

  #joinBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
  }

  /* MOBILE FIXES */
  @media (max-width: 768px) {
    #meetingSDKElement {
      height: calc(100vh - 155px);
    }

    #nameModal > div {
      padding: 30px 20px;
    }

    .meeting-header {
      padding: 12px 15px;
    }

    .meeting-info {
      font-size: 13px;
      padding: 8px 15px;
    }

    #status {
      font-size: 13px;
      padding: 8px 15px;
    }
  }

  @media (max-width: 480px) {
    .meeting-header {
      padding: 10px 12px;
    }

    .meeting-header h3 {
      font-size: 18px;
    }

    .meeting-info {
      font-size: 12px;
      padding: 6px 12px;
    }

    #status {
      font-size: 12px;
      padding: 6px 12px;
    }

    #meetingSDKElement {
      height: calc(100vh - 165px);
    }

    #nameModal > div {
      padding: 25px 15px;
    }

    #nameModal h3 {
      font-size: 20px;
    }
  }
</style>

</head>
<body>
  <!-- Display Name Input Modal -->
  <div id="nameModal" style="display: flex; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 9999; padding: 20px; animation: fadeIn 0.3s ease-out;">
    <div style="background: #1a1a1a; padding: 40px 30px; border-radius: 20px; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #333;">
      <h3 style="color: white; margin-bottom: 25px; font-size: 24px; font-weight: 600;">Join Live Session</h3>
      <p style="color: #ccc; margin-bottom: 25px; font-size: 16px;">{{ session.title }}</p>
      
      <input 
        type="text" 
        id="displayNameInput" 
        placeholder="Enter your display name" 
        style="width: 100%; padding: 15px; border: 2px solid #333; border-radius: 10px; font-size: 16px; background: #111; color: white; box-sizing: border-box; margin-bottom: 25px; transition: border-color 0.3s ease;"
      />
      
      <button 
        id="joinBtn" 
        style="width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);"
        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(102, 126, 234, 0.4)'"
        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(102, 126, 234, 0.3)'"
      >
        Join Session
      </button>
    </div>
  </div>

  <div class="meeting-header">
    <h3>{{ session.title }}</h3>
  </div>

  <div class="meeting-info container-fluid">
    <strong>Meeting ID:</strong> {{ session.meeting_number }} |
    <strong>Passcode:</strong> {{ session.Passcode }} |
    <strong>Date:</strong> {{ session.session_date|date:"M j, Y" }} |
    <strong>Time:</strong> {{ session.session_time|time:"g:i A" }} |
    <strong>Role:</strong> <span style="color: #28a745;">ATTENDEE</span>
  </div>

  <div id="status">Connecting to meeting...</div>
  <div id="meetingSDKElement"></div>

  <!-- Zoom SDK Scripts -->
  <script src="https://source.zoom.us/4.1.0/lib/vendor/react.min.js"></script>
  <script src="https://source.zoom.us/4.1.0/lib/vendor/react-dom.min.js"></script>
  <script src="https://source.zoom.us/4.1.0/lib/vendor/redux.min.js"></script>
  <script src="https://source.zoom.us/4.1.0/lib/vendor/redux-thunk.min.js"></script>
  <script src="https://source.zoom.us/4.1.0/lib/vendor/lodash.min.js"></script>
  <script src="https://source.zoom.us/4.1.0/zoom-meeting-4.1.0.min.js"></script>

  <script>
    let DISPLAY_NAME = "{{ request.user.username|default:'Guest' }}";
    const SDK_KEY = "{{ zoom_sdk_key }}";
    const MEETING_NUMBER = "{{ session.meeting_number }}";
    const PASSCODE = "{{ session.Passcode }}";
    const USER_EMAIL = "{{ request.user.email|default:'attendee@example.com' }}";
    const ROLE = 0;  // 0 = Attendee (user)
    const LEAVE_URL = "about:blank";

    function closeTab() {
      window.close();
    }

    // Handle display name input
    document.getElementById('displayNameInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        startMeeting();
      }
    });


    document.getElementById('joinBtn').addEventListener('click', function() {
      const input = document.getElementById('displayNameInput').value.trim();
      if (!input) {
        alert('Please enter your name');
        return;
      }
      DISPLAY_NAME = input;
      document.getElementById('nameModal').style.display = 'none';
      joinMeeting();
    });

    // The startMeeting function is no longer used for joining in this page
    // function startMeeting() { ... }

    // Focus on input on page load
    window.addEventListener('load', function() {
      document.getElementById('displayNameInput').focus();
    });

    async function getSignature() {
      try {
        console.log("[DEBUG] Fetching signature...");
        const url = `${window.location.origin}/zoom_signature/?meetingNumber=${MEETING_NUMBER}&role=${ROLE}`;
        console.log("[DEBUG] URL:", url);
        
        const response = await fetch(url);
        console.log("[DEBUG] Response status:", response.status);
        
        const data = await response.json();
        console.log("[DEBUG] Response data:", data);
        
        if (data.signature) {
          console.log("[DEBUG] ✓ Signature received, length:", data.signature.length);
          return data.signature;
        }
        throw new Error(data.error || "Signature generation failed");
      } catch (error) {
        console.error("[ERROR] Signature generation failed:", error);
        throw error;
      }
    }

    async function joinMeeting() {
      const status = document.getElementById("status");
      
      try {
        status.textContent = "Initializing Zoom SDK...";
        console.log("[DEBUG] Starting joinMeeting...");
        console.log("[DEBUG] SDK_KEY:", SDK_KEY ? "✓ Present" : "✗ Missing");
        console.log("[DEBUG] Meeting Number:", MEETING_NUMBER);
        console.log("[DEBUG] Role:", ROLE);
        console.log("[DEBUG] User Email:", USER_EMAIL);
        console.log("[DEBUG] Passcode:", PASSCODE ? "✓ Present" : "✗ Missing");
        console.log("[DEBUG] User Email:", USER_EMAIL);

        // Check if user email is required and present
        if (ROLE === 0 && (!USER_EMAIL || USER_EMAIL.trim() === '')) {
          alert('User email is required to join as attendee. Please update your profile with a valid email.');
          status.textContent = "Email required for attendees";
          return;
        }

        // Wait for ZoomMtg to be available
        let attempts = 0;
        while (!window.ZoomMtg && attempts < 50) {
          await new Promise(resolve => setTimeout(resolve, 100));
          attempts++;
        }

        if (!window.ZoomMtg) {
          throw new Error("Zoom SDK failed to load after 5 seconds");
        }

        const ZoomMtg = window.ZoomMtg;
        console.log("[DEBUG] ✓ ZoomMtg available");

        // Setup SDK library paths
        console.log("[DEBUG] Setting up SDK library paths...");
        ZoomMtg.setZoomJSLib("https://source.zoom.us/4.1.0/lib", "/av");
        
        // Preload WebAssembly
        console.log("[DEBUG] Preloading WebAssembly...");
        ZoomMtg.preLoadWasm();
        
        // Prepare Web SDK
        console.log("[DEBUG] Preparing Web SDK...");
        ZoomMtg.prepareWebSDK();
        
        // Setup internationalization
        console.log("[DEBUG] Setting up i18n...");
        ZoomMtg.i18n.load("en-US");
        ZoomMtg.i18n.reload("en-US");
        
        // Give SDK time to prepare
        await new Promise(resolve => setTimeout(resolve, 500));
        
        status.textContent = "Generating signature...";
        console.log("[DEBUG] Getting signature...");
        const signature = await getSignature();

        status.textContent = "Initializing meeting...";
        console.log("[DEBUG] Calling ZoomMtg.init...");
        
        ZoomMtg.init({
          leaveUrl: LEAVE_URL,
          success: function() {
            console.log("[DEBUG] ✓ SDK init success");
            status.textContent = "Joining meeting as ATTENDEE...";
            console.log("[DEBUG] Calling ZoomMtg.join...");
            console.log("[DEBUG] Signature:", signature.substring(0, 50) + "...");

            if (ZoomMtg.inMeetingServiceListener) {
              ZoomMtg.inMeetingServiceListener('onMeetingLeave', closeTab);
              ZoomMtg.inMeetingServiceListener('onUserLeave', closeTab);
            }

            ZoomMtg.join({
              sdkKey: SDK_KEY,
              signature: signature,
              meetingNumber: MEETING_NUMBER,
              passWord: PASSCODE,
              userName: DISPLAY_NAME,
              userEmail: USER_EMAIL,
              success: function() {
                status.textContent = "✓ Successfully joined as ATTENDEE!";
                console.log("[DEBUG] ✓ Successfully joined meeting");
              },
              error: function(e) {
                console.error("[ERROR] Join failed:", e);
                status.textContent = "Join failed: " + (e.errorMessage || JSON.stringify(e));
              }
            });
          },
          error: function(err) {
            console.error("[ERROR] Init failed:", err);
            status.textContent = "SDK initialization failed: " + (err.errorMessage || JSON.stringify(err));
          }
        });
      } catch (error) {
        console.error("[ERROR] Critical error:", error);
        status.textContent = "Error: " + error.message;
      }
    }

    // ✅ Wait for display name to be entered
    // joinMeeting() will be called after user enters name and clicks Join
  </script>

</body>
</html>
