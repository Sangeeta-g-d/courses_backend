<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>SMTA - Reset Password</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="/static/assets/images/logo/smta-final-logo.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

    <link href="/static/home_assets/lib/animate/animate.min.css" rel="stylesheet">
    <link href="/static/home_assets/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <link href="/static/home_assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/home_assets/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/home_assets/css/login.css">
</head>

<body>

    <!-- Spinner Start -->
    <div id="spinner"
        class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    </div>
    <!-- Spinner End -->

    <!-- Topbar Start -->
    <div class="container-fluid bg-primary text-white d-none d-lg-flex wow fadeIn" data-wow-delay="0.1s">
        <div class="container py-3">
            <div class="d-flex align-items-center">
                <a href="/" style="display: flex; align-items: center; text-decoration: none;">
                    <img src="/static/assets/images/logo/smta-final-logo.png" width="50" height="50" alt="">
                    <h2 class="text-white fw-bold m-0">SMTA</h2>
                </a>
                <div class="ms-auto d-flex align-items-center">
                    <small class="ms-4"><i class="fa fa-map-marker-alt me-3"></i>123 Street, Vijayapur</small>
                    <small class="ms-4"><i class="fa fa-envelope me-3"></i>smta@gmail.com</small>
                    <small class="ms-4"><i class="fa fa-phone-alt me-3"></i>+91 7867564534</small>
                </div>
            </div>
        </div>
    </div>
    <!-- Topbar End -->

    <!-- Reset Password Start -->
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-lg-4 wow fadeIn" data-wow-delay="0.1s">
                <div class="bg-light p-5 shadow rounded">

                    <h1 class="display-6 text-uppercase mb-4 text-center">Reset Password</h1>
                    <p class="mb-4 text-muted text-center">
                        Enter your new password below.
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <div class="form-floating">
                                <input type="password" name="password1"
                                    class="form-control border-0 bg-white"
                                    id="password1" placeholder="New Password" required>
                                <label for="password1">New Password</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-floating">
                                <input type="password" name="password2"
                                    class="form-control border-0 bg-white"
                                    id="password2" placeholder="Confirm Password" required>
                                <label for="password2">Confirm Password</label>
                            </div>
                        </div>

                        <button class="btn btn-primary w-100 py-3" type="submit">
                            Reset Password
                        </button>

                        <div class="text-center mt-3">
                            <a href="/user/login/" class="text-decoration-none">
                                Back to Login
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
    <!-- Reset Password End -->

    {% include 'notify.html' %}

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/home_assets/lib/wow/wow.min.js"></script>
    <script src="/static/home_assets/lib/easing/easing.min.js"></script>
    <script src="/static/home_assets/lib/waypoints/waypoints.min.js"></script>
    <script src="/static/home_assets/lib/counterup/counterup.min.js"></script>
    <script src="/static/home_assets/lib/owlcarousel/owl.carousel.min.js"></script>

    <script src="/static/home_assets/js/main.js"></script>

</body>
</html>
